<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213D">
<title>Кемел · Белгілену</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --navy:#14213D; --navy2:#1F2E52; --accent:#E07A1F; --ground:#EEF1F5; --card:#FFFFFF;
  --ink:#14213D; --muted:#5B6475; --line:#E3E7ED; --line2:#C3CBD8;
  --ok-bg:#E6F2EC; --ok:#165C3A; --late-bg:#FDF0E2; --late:#8A4A0C;
  --bad-bg:#FCEBE9; --bad:#8E1F17; --info-bg:#E8EEF8; --info:#1D4E89;
  color-scheme: light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:'PT Sans',system-ui,sans-serif;font-size:16px;line-height:1.4}
h1,h2,h3{margin:0}
.display{font-family:'Unbounded',sans-serif;font-weight:700}
button,input,select,textarea{font-family:inherit;font-size:16px}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.topbar{background:var(--navy);color:#fff;padding:16px;padding-top:max(16px,env(safe-area-inset-top))}
.topbar .wrap{padding:0;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:'Unbounded',sans-serif;font-weight:700;font-size:20px;letter-spacing:.5px}
.who{font-size:14px;color:#C9D2E3}
.linkbtn{background:none;border:none;color:#C9D2E3;text-decoration:underline;cursor:pointer;padding:8px;min-height:44px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 16px 0;max-width:1100px;margin:0 auto;scrollbar-width:none}
.tab{flex:0 0 auto;border:none;border-radius:999px;padding:10px 16px;background:#fff;color:var(--ink);cursor:pointer;min-height:44px;white-space:nowrap}
.tab.on{background:var(--navy);color:#fff;font-weight:700}
.tab .n{display:inline-block;margin-left:6px;background:var(--bad);color:#fff;border-radius:999px;padding:0 7px;font-size:13px;font-weight:700}
.card{background:var(--card);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.muted{color:var(--muted)}
.small{font-size:14px}
.btn{border:none;border-radius:14px;padding:16px 18px;font-weight:700;cursor:pointer;min-height:52px;font-size:17px}
.btn-main{background:var(--accent);color:var(--navy)}
.btn-dark{background:var(--navy);color:#fff}
.btn-light{background:#fff;color:var(--navy);border:1px solid var(--line2)}
.btn-ok{background:var(--ok);color:#fff}
.btn-bad{background:#fff;color:var(--bad);border:1px solid #E5B4AF}
.btn-sm{padding:10px 14px;min-height:44px;font-size:15px;border-radius:10px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.big{font-size:19px;min-height:64px}
label{font-size:15px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
input,select,textarea{border:1px solid var(--line2);border-radius:12px;padding:12px 14px;background:#fff;color:var(--ink);min-height:48px;width:100%}
textarea{resize:vertical;min-height:80px}
.badge{display:inline-block;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-late{background:var(--late-bg);color:var(--late)}
.b-bad{background:var(--bad-bg);color:var(--bad)}
.b-info{background:var(--info-bg);color:var(--info)}
.b-none{background:var(--ground);color:#3D4555;border:1px dashed #8A93A3}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:999px;padding:10px 16px;min-height:44px;cursor:pointer;background:#fff;color:var(--ink);border:1px solid var(--line2)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700}
.big-time{font-family:'Unbounded',sans-serif;font-weight:700;font-size:36px}
.notice{border-radius:14px;padding:14px 16px;font-size:15px}
.n-bad{background:var(--bad-bg);color:var(--bad)}
.n-ok{background:var(--ok-bg);color:var(--ok)}
.n-info{background:var(--info-bg);color:var(--info)}
.n-late{background:var(--late-bg);color:var(--late)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:#fff;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px;border:2px solid transparent;cursor:pointer;text-align:left;min-height:44px}
.tile.on{border-color:currentColor}
.tile .v{font-family:'Unbounded',sans-serif;font-size:26px;font-weight:700}
.list{display:flex;flex-direction:column}
.li{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:none}
.li .main{flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:2px}
.li .times{display:flex;gap:14px;font-size:15px}
.tsbox{overflow-x:auto;background:#fff;border-radius:16px}
table.ts{border-collapse:collapse;font-size:13px;min-width:100%}
table.ts th,table.ts td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:center;white-space:nowrap}
table.ts th:first-child,table.ts td:first-child{text-align:left;position:sticky;left:0;background:#fff;padding-left:14px;min-width:160px;white-space:normal}
table.ts td.we{background:#F1F3F7}
.c-A{color:var(--bad);font-weight:700;background:var(--bad-bg)}
.c-S{color:var(--info);font-weight:700;background:var(--info-bg)}
.c-B{color:var(--late);font-weight:700;background:var(--late-bg)}
.c-q{color:var(--late);font-weight:700}
#reader{width:100%;border-radius:16px;overflow:hidden;background:#0B1326;min-height:280px}
.overlay{position:fixed;inset:0;background:rgba(10,16,32,.85);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.sheet{background:#fff;border-radius:20px;padding:20px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:92vw;padding:14px 18px;border-radius:14px;color:#fff;font-weight:700;z-index:60;display:none;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.qrbox{background:#fff;padding:16px;border-radius:12px;display:inline-block;align-self:flex-start}
.loading{display:flex;align-items:center;justify-content:center;min-height:60vh;color:var(--muted)}
/* finance requests: receipt look */
.rc{background:#fff;border-radius:16px;padding:22px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 0 var(--line)}
.rc-to{align-self:flex-end;text-align:right;font-size:14px;color:var(--muted);line-height:1.45}
.rc-title{text-align:center;font-family:'Unbounded',sans-serif;font-weight:700;font-size:18px;letter-spacing:.5px}
.rc-sub{text-align:center;color:var(--muted);font-size:15px}
.rc-items{display:flex;flex-direction:column;gap:10px;border-top:2px dashed var(--line2);border-bottom:2px dashed var(--line2);padding:14px 0}
.rc-line{display:flex;align-items:baseline;gap:8px;font-size:16px}
.rc-line .nm{min-width:0;overflow-wrap:anywhere}
.rc-line .dots{flex:1 1 24px;border-bottom:2px dotted var(--line2);transform:translateY(-4px);min-width:16px}
.rc-line .sum{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.rc-total{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.rc-total .v{font-family:'Unbounded',sans-serif;font-weight:700;font-size:26px;white-space:nowrap}
.rc-words{font-size:14px;color:var(--muted);font-style:italic}
.steps{display:flex;flex-direction:column;gap:0}
.stp{display:flex;gap:12px;align-items:flex-start;padding:8px 0}
.stp .dot{flex:0 0 28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;border:2px solid var(--line2);color:var(--muted);background:#fff}
.stp.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.stp.now .dot{border-color:var(--accent);color:var(--late);background:var(--late-bg)}
.stp.bad .dot{background:var(--bad);border-color:var(--bad);color:#fff}
.stp .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.mini-steps{display:flex;gap:4px}
.mini-steps span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.mini-steps span.done{background:var(--ok)}
.mini-steps span.now{background:var(--accent)}
.mini-steps span.bad{background:var(--bad)}
.fin-card{background:#fff;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;border:2px solid transparent;text-align:left;width:100%;font:inherit;color:inherit}
.fin-card.turn{border-color:var(--accent)}
.item-row{display:grid;grid-template-columns:minmax(0,1fr) 104px 40px;gap:6px;align-items:center}
.item-row input{padding:10px 12px}
.item-row input{min-height:46px}
.icon-btn{border:none;background:var(--ground);border-radius:10px;height:44px;width:44px;cursor:pointer;font-size:20px;color:var(--muted)}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{position:absolute;left:0;top:0;width:100%;text-align:center;padding-top:40px}
}
</style>
</head>
<body>
<div id="app"><div class="loading">Жүктелуде…</div></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="printArea" style="display:none"></div>

<script>
const SB_URL = 'https://gzupbqtvfchgzxevkahx.supabase.co';
const SB_KEY = 'sb_publishable_2v6DTUcUYh4vPeH0_PHfSg_gZ0xx4i_';
const FN_URL = SB_URL + '/functions/v1/auth';

const POSITIONS = ['Құрылтайшы','Директор','Оқу ісі орынбасары','Тәрбие ісі орынбасары','Ғылыми-әдістемелік орынбасар','Шаруашылық меңгерушісі',
  'Математика мұғалімі','Физика мұғалімі','Информатика мұғалімі','Қазақ тілі мен әдебиеті мұғалімі','Орыс тілі мен әдебиеті мұғалімі',
  'Ағылшын тілі мұғалімі','Химия мұғалімі','Биология мұғалімі','География мұғалімі','Тарих мұғалімі','Бастауыш сынып мұғалімі',
  'Дене шынықтыру мұғалімі','Психолог','Әлеуметтік педагог','Кітапханашы','Медбике','Іс жүргізуші','Бухгалтер','Күзетші','Техникалық қызметкер'];
const LATE_REASONS = ['Көлік кептелісі','Денсаулық','Әкімшілік рұқсатымен','Отбасылық жағдай','Басқа'];
const ABS_REASONS = ['Ауырдым','Іссапар','Отбасылық жағдай','Басқа'];
const EVENT_TITLES = {
  device_mismatch:'Бөтен телефоннан кіру', device_taken_login:'Басқаның телефонынан кіру',
  device_taken_register:'Басқаның телефонынан тіркелу', outside:'Мектептен тыс белгілену', bad_qr:'Жарамсыз QR-код',
  other_face:'Басқа адамның Face ID-імен белгілену'
};

// ---------- utilities ----------
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function ls(k, v){ try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch(e){ return null; } }
function deviceId(){
  let d = ls('kemel_device');
  if (!d) {
    d = (crypto.randomUUID ? crypto.randomUUID() : Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b=>b.toString(16).padStart(2,'0')).join(''));
    ls('kemel_device', d);
  }
  return d;
}
async function rpc(fn, args){
  let r;
  try {
    r = await fetch(SB_URL + '/rest/v1/rpc/' + fn, {
      method:'POST', headers:{ 'apikey': SB_KEY, 'Content-Type':'application/json' }, body: JSON.stringify(args || {})
    });
  } catch(e) { return { ok:false, msg:'Интернет байланысын тексеріңіз.' }; }
  if (!r.ok) return { ok:false, msg:'Сервер қатесі (' + r.status + '). Кейінірек қайталаңыз.' };
  return r.json();
}
async function fn(body){
  let r;
  try {
    r = await fetch(FN_URL, { method:'POST', headers:{ 'apikey': SB_KEY, 'Content-Type':'application/json' }, body: JSON.stringify(body) });
  } catch(e) { return { ok:false, msg:'Интернет байланысын тексеріңіз.' }; }
  if (!r.ok) return { ok:false, msg:'Сервер қатесі (' + r.status + '). Кейінірек қайталаңыз.' };
  return r.json();
}

// ---------- Face ID (WebAuthn / passkey) ----------
const faceSupported = !!(window.PublicKeyCredential && navigator.credentials && navigator.credentials.create);
function b64uToBuf(s){ s = s.replace(/-/g,'+').replace(/_/g,'/'); while (s.length % 4) s += '='; const bin = atob(s); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u.buffer; }
function bufToB64u(b){ const u = new Uint8Array(b); let s = ''; for (let i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
async function faceCreate(o){
  const pk = Object.assign({}, o, { challenge: b64uToBuf(o.challenge), user: Object.assign({}, o.user, { id: b64uToBuf(o.user.id) }),
    excludeCredentials: (o.excludeCredentials || []).map(c => Object.assign({}, c, { id: b64uToBuf(c.id) })) });
  delete pk.hints;
  const c = await navigator.credentials.create({ publicKey: pk });
  return { id: c.id, rawId: bufToB64u(c.rawId), type: c.type,
    response: { clientDataJSON: bufToB64u(c.response.clientDataJSON), attestationObject: bufToB64u(c.response.attestationObject),
      transports: c.response.getTransports ? c.response.getTransports() : [] },
    clientExtensionResults: c.getClientExtensionResults ? c.getClientExtensionResults() : {}, authenticatorAttachment: c.authenticatorAttachment };
}
async function faceGet(o){
  const pk = Object.assign({}, o, { challenge: b64uToBuf(o.challenge), allowCredentials: (o.allowCredentials || []).map(c => Object.assign({}, c, { id: b64uToBuf(c.id) })) });
  delete pk.hints;
  const c = await navigator.credentials.get({ publicKey: pk });
  return { id: c.id, rawId: bufToB64u(c.rawId), type: c.type,
    response: { clientDataJSON: bufToB64u(c.response.clientDataJSON), authenticatorData: bufToB64u(c.response.authenticatorData),
      signature: bufToB64u(c.response.signature), userHandle: c.response.userHandle ? bufToB64u(c.response.userHandle) : undefined },
    clientExtensionResults: c.getClientExtensionResults ? c.getClientExtensionResults() : {}, authenticatorAttachment: c.authenticatorAttachment };
}
function faceErr(e){
  if (e && e.name === 'NotAllowedError') return 'Face ID болдырылмады немесе уақыты өтті. Қайта басыңыз.';
  if (e && e.name === 'InvalidStateError') return 'Бұл телефонда Face ID бұрын орнатылған. «Кіру» батырмасын басыңыз.';
  if (e && e.name === 'SecurityError') return 'Сайтты тек zhmereikhan.github.io/kemel мекенжайынан ашыңыз.';
  return 'Face ID қатесі: ' + ((e && e.message) || e);
}
// options are fetched before the tap, because Safari only allows Face ID straight from a button press
async function freshAuthOptions(){
  if (S.authOpts && Date.now() - S.authOpts.at < 4 * 60 * 1000) return S.authOpts.options;
  const r = await fn({ action:'auth_options' });
  if (!r.ok) { toast(r.msg, 'bad'); return null; }
  S.authOpts = { options: r.options, at: Date.now() };
  return r.options;
}
function takeAuthOptions(){
  const o = S.authOpts && Date.now() - S.authOpts.at < 4 * 60 * 1000 ? S.authOpts.options : null;
  S.authOpts = null;
  return o;
}
function fmtPhone(v){
  let d = v.replace(/\D/g, '');
  if (d.startsWith('8')) d = '7' + d.slice(1);
  if (!d.startsWith('7')) d = '7' + d;
  d = d.slice(0, 11);
  const p = [d.slice(1,4), d.slice(4,7), d.slice(7,9), d.slice(9,11)].filter(Boolean);
  return '+7 ' + p.join(' ');
}

function toast(msg, kind){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = kind === 'bad' ? '#8E1F17' : kind === 'ok' ? '#165C3A' : '#14213D';
  t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', 4200);
}
function getPosition(){
  return new Promise((resolve) => {
    if (!navigator.geolocation) return resolve({ err:'Телефоныңыз геолокацияны қолдамайды.' });
    navigator.geolocation.getCurrentPosition(
      p => resolve({ lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy }),
      e => resolve({ err: e.code === 1 ? 'Геолокацияға рұқсат берілмеді. Браузер баптауынан рұқсат беріңіз.' : 'Орналасуды анықтау мүмкін болмады. Қайталап көріңіз.' }),
      { enableHighAccuracy:true, timeout:20000, maximumAge:0 });
  });
}
const KZ_MONTHS = ['қаңтар','ақпан','наурыз','сәуір','мамыр','маусым','шілде','тамыз','қыркүйек','қазан','қараша','желтоқсан'];
const KZ_DAYS = ['жексенбі','дүйсенбі','сейсенбі','сәрсенбі','бейсенбі','жұма','сенбі'];
function fmtDay(iso){ const d = new Date(iso + 'T00:00:00'); return d.getDate() + ' ' + KZ_MONTHS[d.getMonth()] + ', ' + KZ_DAYS[d.getDay()]; }

// ---------- state ----------
const S = {
  token: ls('kemel_token'), profile: null, today: null,
  authTab: 'login', pendingQr: null, busy: false,
  authOpts: null, reg: null, pend: null,
  lateReason: null, absReason: null,
  tab: 'me', admin: null, adminDay: null, filter: 'all',
  ts: null, tsYear: null, tsMonth: null
};

// a link from Telegram: #fin=7 opens that finance request after sign-in
(function(){
  const m = location.hash.match(/fin=(\d+)/);
  if (m) { S.openFin = Number(m[1]); history.replaceState(null, '', location.pathname + location.search); }
})();
// pick up the school QR when the page is opened by scanning it with the phone camera
(function(){
  const u = new URL(location.href);
  const k = u.searchParams.get('k');
  if (k) { S.pendingQr = k; u.searchParams.delete('k'); history.replaceState(null, '', u.pathname + u.search + u.hash); }
})();

// ---------- rendering ----------
function render(){
  const app = document.getElementById('app');
  if (!S.token || !S.profile) { app.innerHTML = authView(); return; }
  const isAdmin = S.profile.role === 'admin';
  let body = '';
  if (S.tab === 'fin') body = finView();
  else if (S.tab === 'me' || !isAdmin) body = meView();
  else if (S.tab === 'today') body = todayView();
  else if (S.tab === 'approve') body = approveView();
  else if (S.tab === 'events') body = eventsView();
  else if (S.tab === 'staff') body = staffView();
  else if (S.tab === 'ts') body = tsView();
  else if (S.tab === 'settings') body = settingsView();
  app.innerHTML = topbar() + tabsView() + '<div class="wrap">' + body + '</div>';
  if (S.tab === 'settings' && isAdmin) drawQr();
}

function topbar(){
  return `<header class="topbar"><div class="wrap">
    <div><div class="brand">КЕМЕЛ</div><div class="who">${esc(S.profile.full_name)} · ${esc(S.profile.position)}</div></div>
    <button class="linkbtn" onclick="A.logout()">Шығу</button>
  </div></header>`;
}

function tabsView(){
  const a = S.admin;
  const pend = a ? a.pending_users.length + a.staff.filter(s => s.absence && s.absence.status === 'pending').length : 0;
  const ev = a ? a.unseen_events : 0;
  const t = (id, label, n) => `<button class="tab ${S.tab===id?'on':''}" onclick="A.go('${id}')">${label}${n?`<span class="n">${n}</span>`:''}</button>`;
  if (S.profile.role !== 'admin') return `<nav class="tabs" aria-label="Бөлімдер">${t('me','Белгілену')}${t('fin','Қаржы өтінімдері',S.finTodo)}</nav>`;

// a Face ID sign-in less than ~3 minutes ago also covers the check-in (the server checks the same rule)
function freshLogin(){ return !!S.loginAt && Date.now() - S.loginAt < 170 * 1000; }
function distM(lat1, lng1, lat2, lng2){
  const R = 6371000, r = x => x * Math.PI / 180;
  const a = Math.sin(r(lat2-lat1)/2)**2 + Math.cos(r(lat1))*Math.cos(r(lat2))*Math.sin(r(lng2-lng1)/2)**2;
  return Math.round(2 * R * Math.asin(Math.sqrt(a)));
}
// the confirm card: location first, QR only when needed, then Face ID
function pendView(sch){
  const p = S.pend;
  const okS = 'color:var(--ok);font-weight:700', badS = 'color:var(--bad);font-weight:700', warnS = 'color:var(--late);font-weight:700';
  let locLine = '<span class="muted">тексерілуде…</span>', state = 'wait', d = null;
  if (p.posErr) { locLine = `<span style="${badS}">✕ анықталмады</span>`; state = 'poserr'; }
  else if (p.pos) {
    d = sch.lat != null ? distM(sch.lat, sch.lng, p.pos.lat, p.pos.lng) : null;
    if (d === null || d <= sch.radius_m) { locLine = `<span style="${okS}">✓ мектеп аумағында</span>`; state = 'ok'; }
    else if (d <= sch.fallback_radius_m) { locLine = `<span style="${warnS}">≈${d} м, дәл емес</span>`; state = 'near'; }
    else { locLine = `<span style="${badS}">✕ мектептен ≈${d} м алыс</span>`; state = 'far'; }
  }
  const needQr = !p.qr && (p.needQr || ((state === 'ok' || state === 'near') && (sch.qr_required || state === 'near')));
  const qrLine = p.qr ? `<span style="${okS}">✓ оқылды</span>` : needQr ? `<span style="${warnS}">сканерлеу керек</span>` : '<span class="muted">керек емес</span>';
  const fresh = freshLogin();
  const ready = (state === 'ok' || state === 'near') && !needQr && (fresh || S.authOpts) && !S.busy;
  let action = '';
  if (state === 'poserr') action = `<div class="notice n-bad small">${esc(p.posErr)}</div><button class="btn btn-light" onclick="A.prepare('${p.kind}', S.pend.qr)">Қайта тексеру</button>`;
  else if (state === 'far') action = `<div class="notice n-bad small">Сіз мектеп аумағынан тыс жердесіз. Мектепке келгенде қайталаңыз.</div><button class="btn btn-light" onclick="A.prepare('${p.kind}', S.pend.qr)">Қайта тексеру</button>`;
  else if (needQr) action = `<div class="notice n-late small">${sch.qr_required ? 'Мектепте QR-код міндетті.' : 'Ғимарат ішінде GPS дәл анықтамады.'} Кіреберістегі QR-кодты сканерлеңіз.</div>
      <button class="btn btn-dark big" onclick="A.scanForPend()">QR-кодты сканерлеу</button>`;
  else action = fresh
    ? `<button class="btn btn-main big" onclick="A.confirm()" ${ready?'':'disabled'}>${p.kind==='in'?'Келдім деп растау':'Кеттім деп растау'}</button>
       <div class="small muted" style="text-align:center">Жаңа ғана Face ID-мен кірдіңіз, қайта сұралмайды.</div>`
    : `<button class="btn btn-main big" onclick="A.confirm()" style="display:flex;align-items:center;justify-content:center;gap:10px" ${ready?'':'disabled'}>${FACE_ICON} Face ID-мен растау</button>`;
  return `<section class="card" style="border:2px solid var(--accent)">
      <h2 style="font-size:20px">${p.kind==='in'?'Келгеніңізді растаңыз':'Кеткеніңізді растаңыз'}</h2>
      <div class="row" style="justify-content:space-between"><span>Орналасу</span>${locLine}</div>
      <div class="row" style="justify-content:space-between"><span>QR-код</span>${qrLine}</div>
      ${action}
      <button class="btn btn-light" onclick="S.pend=null;render()">Болдырмау</button></section>`;
}

// ---------- finance requests ----------
function fmtMoney(n){
  const v = Number(n) || 0;
  return v.toLocaleString('ru-RU', { minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits: 2 }) + ' ₸';
}
// amount in Kazakh words, e.g. 108958 -> "жүз сегіз мың тоғыз жүз елу сегіз"
function kzWords(n){
  n = Math.floor(Number(n) || 0);
  if (n === 0) return 'нөл';
  const ones = ['', 'бір', 'екі', 'үш', 'төрт', 'бес', 'алты', 'жеті', 'сегіз', 'тоғыз'];
  const tens = ['', 'он', 'жиырма', 'отыз', 'қырық', 'елу', 'алпыс', 'жетпіс', 'сексен', 'тоқсан'];
  const tri = (x) => {
    const h = Math.floor(x / 100), t = Math.floor(x % 100 / 10), o = x % 10, w = [];
    if (h) w.push(h === 1 ? 'жүз' : ones[h] + ' жүз');
    if (t) w.push(tens[t]);
    if (o) w.push(ones[o]);
    return w.join(' ');
  };
  const parts = [], bil = Math.floor(n / 1e9), mil = Math.floor(n % 1e9 / 1e6), th = Math.floor(n % 1e6 / 1000), rest = n % 1000;
  if (bil) parts.push(tri(bil) + ' миллиард');
  if (mil) parts.push(tri(mil) + ' миллион');
  if (th) parts.push(tri(th) + ' мың');
  if (rest) parts.push(tri(rest));
  return parts.join(' ');
}
function finStatus(r){
  if (r.status === 'paid') return ['Төленді', 'b-ok'];
  if (r.status === 'rejected') return ['Қабылданбады', 'b-bad'];
  if (r.status === 'approved') return ['Бухгалтерде', 'b-info'];
  const c = r.chain[r.step] || {};
  return ['Растауда: ' + (c.label || ''), 'b-late'];
}
function stepState(r, i){
  const rejectedAt = r.status === 'rejected' ? (r.history.filter(h => h.action === 'reject').slice(-1)[0] || {}).step : null;
  if (r.status === 'rejected' && i === rejectedAt) return 'bad';
  if (r.status === 'paid' || i < r.step) return 'done';
  if (i === r.step && r.status !== 'rejected') return 'now';
  return '';
}
function receiptHTML(r, forPrint){
  const dir = r.chain[0] || {};
  const lines = r.items.map(it => `<div class="rc-line"><span class="nm">${esc(it.name)}</span><span class="dots"></span><span class="sum">${fmtMoney(it.amount)}</span></div>`).join('');
  const sch = '«KEMEL» қалалық физика-математика мектебі';
  return `<div class="rc" ${forPrint ? 'style="box-shadow:none;max-width:640px;margin:0 auto;text-align:left;font-family:\'PT Sans\',sans-serif"' : ''}>
    <div class="rc-to">${esc(sch)}<br>${esc(dir.label || 'Директор')}: <b>${esc(dir.name || '')}</b></div>
    <div><div class="rc-title">ӨТІНІШ №${r.id}</div><div class="rc-sub">${esc(r.title)}${r.event_date ? ' · ' + esc(fmtDateDot(r.event_date)) : ''}</div></div>
    <div class="rc-items">${lines}</div>
    <div class="rc-total"><span style="font-weight:700">Жалпы сома</span><span class="v">${fmtMoney(r.total)}</span></div>
    <div class="rc-words">(${esc(kzWords(r.total))} теңге) бөлуіңізді сұраймын.</div>
    ${r.note ? `<div class="small" style="white-space:pre-line">${esc(r.note)}</div>` : ''}
    <div class="small" style="border-top:1px solid var(--line);padding-top:10px">${esc(r.author.position)}: <b>${esc(r.author.full_name)}</b> · ${esc(r.created)}</div>
  </div>`;
}
function fmtDateDot(iso){ const [y, m, d] = String(iso).split('-'); return d + '.' + m + '.' + y; }
function stepsHTML(r){
  return `<div class="steps">${r.chain.map((c, i) => {
    const s = stepState(r, i);
    const h = r.history.filter(x => x.step === i && x.action !== 'submit' && x.action !== 'resubmit').slice(-1)[0];
    const what = s === 'done' ? (h && h.action === 'pay' ? 'Төледі' : 'Растады') : s === 'bad' ? 'Қабылдамады' : s === 'now' ? 'Кезегі келді' : 'Күтуде';
    return `<div class="stp ${s}"><span class="dot">${s === 'done' ? '✓' : s === 'bad' ? '✕' : i + 1}</span>
      <div class="tx"><b>${esc(c.label)}: ${esc(c.name || '—')}</b>
      <span class="small muted">${what}${h ? ' · ' + esc(h.at) : ''}</span>
      ${h && h.comment ? `<span class="small">«${esc(h.comment)}»</span>` : ''}</div></div>`;
  }).join('')}</div>`;
}
function finView(){
  if (S.finMode === 'new') return finFormView();
  const list = S.finList;
  if (!list) return '<div class="loading">Жүктелуде…</div>';
  if (S.finMode === 'view') {
    const r = list.find(x => x.id === S.finOpen);
    if (!r) { S.finMode = 'list'; return finView(); }
    const st = finStatus(r);
    const last = r.step >= r.chain.length - 1;
    let act = '';
    if (r.my_turn) act = `<section class="card" style="border:2px solid var(--accent)">
        <h2 style="font-size:18px">Сіздің шешіміңіз</h2>
        <label>Түсініктеме ${last ? '(міндетті емес)' : '(қабылдамаса, міндетті)'}<textarea id="finComment" rows="2"></textarea></label>
        <button class="btn btn-ok big" onclick="A.finDecide('approve')" ${S.busy?'disabled':''}>${last ? 'Төленді деп белгілеу' : 'Растау'}</button>
        <button class="btn btn-bad" onclick="A.finDecide('reject')" ${S.busy?'disabled':''}>Қабылдамау</button></section>`;
    else if (r.is_author && r.status === 'rejected') act = `<button class="btn btn-dark" onclick="A.finEdit(${r.id})">Түзетіп қайта жіберу</button>`;
    return `<div class="stack" style="max-width:640px;margin:0 auto">
      <div class="row" style="justify-content:space-between"><button class="btn btn-light btn-sm" onclick="A.finBack()">← Тізімге</button>
        <span class="badge ${st[1]}">${esc(st[0])}</span></div>
      ${receiptHTML(r, false)}
      ${act}
      <section class="card"><h2 style="font-size:18px">Растау жолы</h2>${stepsHTML(r)}</section>
      <button class="btn btn-light btn-sm" style="align-self:flex-start" onclick="A.finPrint(${r.id})">Басып шығару</button>
    </div>`;
  }
  const f = S.finFilter || 'all';
  const todo = list.filter(r => r.my_turn), mine = list.filter(r => r.is_author);
  const shown = f === 'todo' ? todo : f === 'mine' ? mine : list;
  const chip = (id, label, n) => `<button class="chip ${f===id?'on':''}" onclick="S.finFilter='${id}';render()">${label}${n !== undefined ? ' (' + n + ')' : ''}</button>`;

    const st = finStatus(r);
    const bars = r.chain.map((c, i) => `<span class="${stepState(r, i)}"></span>`).join('');

    <div class="chips">${chip('todo','Менің кезегім',todo.length)}${chip('mine','Менің өтінімдерім',mine.length)}${chip('all','Барлығы')}</div>
    <div class="stack" style="gap:10px">${cards}</div>
  </div>`;
}
function finFormView(){

function finSum(){ return S.finForm.items.reduce((s, it) => s + (parseFloat(String(it.amount).replace(',', '.')) || 0), 0); }
function finTotal(){
  const t = document.getElementById('fTotal'), w = document.getElementById('fWords');
  if (t) t.textContent = fmtMoney(finSum());
  if (w) w.textContent = kzWords(finSum()) + ' теңге';
}

// ---------- admin views ----------
function statusOf(s){
  if (s.check_in) return s.late_min > 0 ? 'late' : 'ok';
  if (s.absence) return 'away';
  return 'none';
}
function todayView(){
  const a = S.admin;
  if (!a) return '<div class="loading">Жүктелуде…</div>';
  const counts = { all:a.staff.length, ok:0, late:0, away:0, none:0 };
  a.staff.forEach(s => counts[statusOf(s)]++);
  const tdef = [['all','Барлығы','#14213D'],['ok','Уақытында','#165C3A'],['late','Кешіккен','#8A4A0C'],['away','Себеппен жоқ','#1D4E89'],['none','Белгіленбеген','#8E1F17']];
  const tiles = tdef.map(t => `<button class="tile ${S.filter===t[0]?'on':''}" style="color:${t[2]}" onclick="A.filter('${t[0]}')"><span class="small">${t[1]}</span><span class="v">${counts[t[0]]}</span></button>`).join('');
  const rows = a.staff.filter(s => S.filter==='all' || statusOf(s)===S.filter).map(s => {
    const st = statusOf(s);
    let badge = st==='ok' ? '<span class="badge b-ok">Уақытында</span>' : st==='late' ? `<span class="badge b-late">Кешікті · ${s.late_min} мин</span>`
      : st==='away' ? `<span class="badge b-info">${esc(s.absence.reason)}${s.absence.status==='pending'?' · растау күтуде':s.absence.status==='rejected'?' · қабылданбады':''}</span>` : '<span class="badge b-none">Белгіленбеген</span>';
    const note = s.late_reason ? 'Себебі: ' + esc(s.late_reason) : (s.absence && s.absence.note ? esc(s.absence.note) : '');
    return `<div class="li"><div class="main"><b>${esc(s.full_name)}</b><span class="small muted">${esc(s.position)}${note?' · '+note:''}</span></div>
      <div class="times"><span>Келді: <b>${esc(s.check_in||'—')}</b>${s.in_method==='qr'?` <span class="badge b-info" title="GPS дәл болмады, QR арқылы">QR · ${s.in_dist} м</span>`:''}</span><span>Кетті: <b>${esc(s.check_out||'—')}</b></span></div>${badge}</div>`;
  }).join('') || '<div class="muted" style="padding:12px 0">Бұл сүзгі бойынша ешкім жоқ.</div>';
  return `<div class="stack">
    <div class="row" style="justify-content:space-between">
      <h1 class="display" style="font-size:24px">Қатысу · ${fmtDay(a.day)}</h1>
      <label style="flex-direction:row;align-items:center;gap:8px">Күн:<input type="date" value="${a.day}" onchange="A.setDay(this.value)" style="width:auto"></label>
    </div>
    <div class="tiles">${tiles}</div>
    <section class="card"><div class="list">${rows}</div></section>
    <button class="btn btn-light btn-sm" style="align-self:flex-start" onclick="A.refresh()">Жаңарту</button>
  </div>`;
}

function tsView(){
  const ts = S.ts;
  const monthOpts = KZ_MONTHS.map((m,i) => `<option value="${i+1}" ${S.tsMonth===i+1?'selected':''}>${m}</option>`).join('');
  let table = '<div class="loading" style="min-height:120px">Жүктелуде…</div>';
  if (ts) {
    let head = '<th>Аты-жөні</th>';
    const we = [];
    for (let d = 1; d <= ts.days; d++) { const w = new Date(S.tsYear, S.tsMonth-1, d).getDay(); we[d] = (w===0||w===6); head += `<th class="${we[d]?'we':''}">${d}</th>`; }
    head += '<th>Сағат</th><th>Кешігу</th>';
    const body = ts.rows.map(r => {
      const cells = r.cells.map((c, i) => {
        const cls = c==='А'?'c-A':c==='С'?'c-S':c==='Б'?'c-B':c==='?'?'c-q':'';
        return `<td class="${cls} ${we[i+1]?'we':''}">${c===null?'':esc(c)}</td>`;
      }).join('');
      return `<tr><td><b>${esc(r.full_name)}</b><br><span class="muted">${esc(r.position)}</span></td>${cells}<td><b>${r.total}</b></td><td>${r.late_count}</td></tr>`;
    }).join('');
    table = `<div class="tsbox"><table class="ts"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
  }
  return `<div class="stack">
    <div class="row" style="justify-content:space-between"><h1 class="display" style="font-size:24px">Табель</h1>
      <div class="row"><select onchange="A.tsMonth(+this.value)" style="width:auto">${monthOpts}</select>
        <input type="number" value="${S.tsYear}" min="2024" max="2100" onchange="A.tsYear(+this.value)" style="width:100px">
        <button class="btn btn-light btn-sm" onclick="A.loadTs()">Жаңарту</button>
        <button class="btn btn-dark btn-sm" onclick="A.csv()" ${ts?'':'disabled'}>Excel-ге жүктеу</button></div></div>
    <div class="row small muted" style="gap:16px"><span>Сан — жұмыс сағаты</span><span><b style="color:var(--bad)">А</b> — ауруы</span><span><b style="color:var(--info)">С</b> — іссапар</span><span><b style="color:var(--late)">Б</b> — басқа себеп</span><span><b style="color:var(--late)">?</b> — «кеттім» белгіленбеген</span></div>
    ${table}
  </div>`;
}

}

function qrUrl(){ return location.origin + location.pathname + '?k=' + encodeURIComponent(S.admin.settings.qr_key); }
function drawQr(){
  const el = document.getElementById('qr');
  if (!el || !window.QRCode) return;
  el.innerHTML = '';
  new QRCode(el, { text: qrUrl(), width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M });
}

// ---------- scanner ----------
let scanner = null;
function openScanner(onCode){
  const ov = document.createElement('div');
  ov.className = 'overlay'; ov.id = 'scanOv';
  ov.innerHTML = `<div class="sheet"><h2 style="font-size:18px">QR-кодты рамкаға келтіріңіз</h2><div id="reader"></div>
    <button class="btn btn-light" id="scanCancel">Болдырмау</button></div>`;
  document.body.appendChild(ov);
  const close = async () => { try { if (scanner) { await scanner.stop(); scanner.clear(); } } catch(e){} scanner = null; ov.remove(); };
  document.getElementById('scanCancel').onclick = close;
  if (!window.Html5Qrcode) { toast('Сканер жүктелмеді. Телефон камерасымен сканерлеңіз.', 'bad'); close(); return; }
  scanner = new Html5Qrcode('reader');
  scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: 220 }, async (text) => {
    await close();
    let k = text;
    try { k = new URL(text).searchParams.get('k') || text; } catch(e) {}
    onCode(k);
  }).catch(() => { toast('Камераға рұқсат берілмеді. Телефонның камерасымен сканерлеп көріңіз.', 'bad'); close(); });
}

    const p = S.pend; if (!p || !p.pos) return;

    let resp;
    try { resp = await faceGet(o); } catch(e) { freshAuthOptions().then(render); toast(faceErr(e), 'bad'); return; }

    if (!confirm(q)) return;
    const r = await rpc('admin_regenerate', { p_token: S.token, p_device: deviceId(), p_what: what });
    if (!r.ok) { toast(r.msg, 'bad'); return; }
    toast('Жаңартылды.', 'ok'); A.loadAdmin();
  },
  printQr(){
    const pa = document.getElementById('printArea');
    pa.innerHTML = `<div style="font-family:Unbounded,sans-serif;font-size:36px;font-weight:700">${esc(S.admin.settings.school_name)}</div>
      <div style="font-size:24px;margin:12px 0 28px">Келдім / Кеттім — QR-кодты сканерлеңіз</div><div id="qrPrint" style="display:inline-block"></div>
      <div style="font-size:16px;margin-top:24px;color:#555">Тек өз телефоныңыздан белгіленіңіз</div>`;
    pa.style.display = 'block';
    new QRCode(document.getElementById('qrPrint'), { text: qrUrl(), width: 420, height: 420, correctLevel: QRCode.CorrectLevel.M });
    setTimeout(() => { window.print(); pa.style.display = 'none'; }, 300);
  },
  async loadTs(){
    S.ts = null; render();
    const r = await rpc('admin_timesheet', { p_token: S.token, p_device: deviceId(), p_year: S.tsYear, p_month: S.tsMonth });
    if (!r.ok) { toast(r.msg, 'bad'); return; }
    S.ts = r; render();
  },
  tsMonth(m){ S.tsMonth = m; A.loadTs(); },
  tsYear(y){ S.tsYear = y; A.loadTs(); },
  csv(){
    const ts = S.ts; if (!ts) return;
    const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const head = ['Аты-жөні', 'Лауазымы']; for (let d = 1; d <= ts.days; d++) head.push(d); head.push('Барлығы, сағ', 'Кешігу саны');
    const lines = [head.map(q).join(';')];
    ts.rows.forEach(r => lines.push([r.full_name, r.position, ...r.cells.map(c => c === null ? '' : String(c).replace('.', ',')), String(r.total).replace('.', ','), r.late_count].map(q).join(';')));
    const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'Табель_' + KZ_MONTHS[S.tsMonth-1] + '_' + S.tsYear + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
  }
};

// ---------- start ----------
// ---------- auto sign-out after 5 minutes without activity ----------
const IDLE_MS = 5 * 60 * 1000;
function touchActivity(){
  const now = Date.now();
  if (!touchActivity._t || now - touchActivity._t > 5000) { touchActivity._t = now; ls('kemel_last', String(now)); }
}
function idleTooLong(){
  const last = Number(ls('kemel_last') || 0);
  return !!S.token && last > 0 && Date.now() - last > IDLE_MS;
}
function lockScreen(showMsg){
  const t = S.token;
  if (t) rpc('logout', { p_token: t });
  S.token = null; S.profile = null; S.admin = null; S.today = null; S.pend = null; S.ts = null;
  S.authTab = 'login'; S.reg = null; S.loginAt = 0;
  ls('kemel_token', null);
  document.querySelectorAll('.overlay').forEach(o => o.remove());
  render();
  if (faceSupported) freshAuthOptions().then(render);
  if (showMsg) toast('Қауіпсіздік үшін жүйеден шықтыңыз. Face ID арқылы қайта кіріңіз.');
}
function checkIdle(){ if (idleTooLong()) lockScreen(true); }
['pointerdown', 'keydown', 'scroll', 'touchstart'].forEach(ev => window.addEventListener(ev, touchActivity, { passive: true, capture: true }));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkIdle(); });
window.addEventListener('pageshow', checkIdle);
setInterval(checkIdle, 15000);

(function init(){
  const now = new Date(); S.tsYear = now.getFullYear(); S.tsMonth = now.getMonth() + 1;
  deviceId();
  if (S.token && idleTooLong()) { lockScreen(false); touchActivity(); return; }
  touchActivity();
  if (S.token) { A.loadMe().then(() => { if (S.profile && S.profile.role === 'admin') A.loadAdmin(); }); }
  else { render(); if (faceSupported) freshAuthOptions(); }
})();
</script>
